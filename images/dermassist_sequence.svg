<?xml version="1.0" encoding="UTF-8"?>
<svg id="seq-svg" viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
<defs><style>
.th{font:500 14px Arial;fill:#1a1a1a}.ts{font:400 12px Arial;fill:#555}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}
.c-amber rect{fill:#FAEEDA;stroke:#BA7517}.c-amber .th{fill:#633806}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#4A1B0C}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th,.c-red .ts{fill:#501313}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#2C2C2A}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker></defs>

<!-- Participants -->
<g class="c-teal"><rect x="20" y="10" width="96" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="68" y="36" text-anchor="middle">Browser</text></g>
<g class="c-purple"><rect x="160" y="10" width="110" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="36" text-anchor="middle">FastAPI/WS</text></g>
<g class="c-amber"><rect x="318" y="10" width="110" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="373" y="36" text-anchor="middle">ADK Runner</text></g>
<g class="c-blue"><rect x="476" y="10" width="98" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="36" text-anchor="middle">Gemini Live</text></g>
<g class="c-coral"><rect x="594" y="10" width="74" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="631" y="36" text-anchor="middle">G Search</text></g>

<!-- Lifelines -->
<line x1="68" y1="54" x2="68" y2="1010" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="215" y1="54" x2="215" y2="1010" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="373" y1="54" x2="373" y2="1010" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="525" y1="54" x2="525" y2="1010" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="631" y1="54" x2="631" y2="1010" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>

<!-- Phase 1 -->
<rect x="28" y="66" width="640" height="18" rx="4" fill="#EF9F27" opacity=".18"/>
<text class="ts" x="340" y="79" text-anchor="middle" fill="#BA7517" font-weight="bold">Phase 1 — App initialization (server startup, once)</text>
<line x1="215" y1="96" x2="370" y2="96" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="90" text-anchor="middle" fill="#534AB7">create Agent + SessionService + Runner</text>

<!-- Phase 2 -->
<rect x="28" y="114" width="640" height="18" rx="4" fill="#9FE1CB" opacity=".25"/>
<text class="ts" x="340" y="127" text-anchor="middle" fill="#0F6E56" font-weight="bold">Phase 2 — Session init (per WebSocket connection)</text>
<line x1="68" y1="146" x2="212" y2="146" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="140" text-anchor="middle">WS connect</text>
<line x1="215" y1="164" x2="370" y2="164" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="158" text-anchor="middle">get_or_create_session(user_id)</text>
<line x1="373" y1="182" x2="218" y2="182" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="176" text-anchor="middle">session (conversation history)</text>
<line x1="215" y1="200" x2="370" y2="200" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="194" text-anchor="middle">create LiveRequestQueue + RunConfig</text>
<line x1="215" y1="218" x2="370" y2="218" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="212" text-anchor="middle">runner.run_live() → starts event loop</text>
<line x1="373" y1="236" x2="522" y2="236" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="445" y="230" text-anchor="middle">open Live API session (BIDI WS)</text>

<!-- Phase 3 -->
<rect x="28" y="252" width="640" height="18" rx="4" fill="#AFA9EC" opacity=".22"/>
<text class="ts" x="340" y="265" text-anchor="middle" fill="#534AB7" font-weight="bold">Phase 3 — Bidirectional streaming (upstream + downstream concurrent tasks)</text>

<rect x="28" y="276" width="640" height="124" rx="6" fill="none" stroke="#1D9E75" stroke-width="0.7" stroke-dasharray="4 3"/>
<text class="ts" x="38" y="290" fill="#0F6E56">↑ upstream task</text>
<line x1="68" y1="302" x2="212" y2="302" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="296" text-anchor="middle">text / audio / image</text>
<line x1="215" y1="320" x2="370" y2="320" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="314" text-anchor="middle">queue.send_content(text)</text>
<text class="ts" x="290" y="332" text-anchor="middle">queue.send_realtime(audio_blob)</text>
<line x1="215" y1="350" x2="370" y2="350" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="344" text-anchor="middle">queue.send_realtime(image_blob)</text>
<line x1="373" y1="368" x2="522" y2="368" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="445" y="362" text-anchor="middle">stream chunks → Gemini Live API</text>

<rect x="28" y="416" width="640" height="306" rx="6" fill="none" stroke="#7F77DD" stroke-width="0.7" stroke-dasharray="4 3"/>
<text class="ts" x="38" y="430" fill="#534AB7">↓ downstream task — async for event in run_live()</text>
<line x1="525" y1="444" x2="376" y2="444" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="438" text-anchor="middle">VAD: user stopped speaking</text>
<line x1="373" y1="462" x2="218" y2="462" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="456" text-anchor="middle">event: input_transcription.text</text>
<line x1="215" y1="476" x2="70" y2="476" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="470" text-anchor="middle">show user words in UI</text>
<line x1="525" y1="496" x2="376" y2="496" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="490" text-anchor="middle">event: tool_call (google_search)</text>
<line x1="373" y1="514" x2="628" y2="514" fill="none" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="508" text-anchor="middle">search: derm guidelines 2026</text>
<line x1="628" y1="532" x2="376" y2="532" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="526" text-anchor="middle">results: AAD/UpToDate/BMJ</text>
<line x1="373" y1="550" x2="522" y2="550" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="445" y="544" text-anchor="middle">event: tool_response → continue</text>
<line x1="525" y1="570" x2="376" y2="570" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="564" text-anchor="middle">event: audio (inline_data 24kHz)</text>
<line x1="373" y1="588" x2="218" y2="588" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="582" text-anchor="middle">event: text (partial=True chunks)</text>
<line x1="215" y1="606" x2="70" y2="606" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="600" text-anchor="middle">stream audio + text → UI</text>
<rect x="36" y="620" width="630" height="18" rx="3" fill="#FAECE7" opacity=".7"/>
<text class="ts" x="340" y="633" text-anchor="middle" fill="#993C1D">If user speaks → event.interrupted=True → stop playback, clear partial text</text>
<line x1="525" y1="652" x2="376" y2="652" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="646" text-anchor="middle">event: turn_complete=True</text>
<line x1="373" y1="670" x2="218" y2="670" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="664" text-anchor="middle">event: output_transcription</text>
<line x1="215" y1="688" x2="70" y2="688" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="682" text-anchor="middle">re-enable mic · hide spinner</text>

<!-- Phase 4 -->
<rect x="28" y="740" width="640" height="18" rx="4" fill="#F7C1C1" opacity=".3"/>
<text class="ts" x="340" y="753" text-anchor="middle" fill="#A32D2D" font-weight="bold">Phase 4 — Session termination</text>
<line x1="68" y1="772" x2="212" y2="772" fill="none" stroke="#E24B4A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="766" text-anchor="middle">WS disconnect</text>
<line x1="215" y1="790" x2="370" y2="790" fill="none" stroke="#7F77DD" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="784" text-anchor="middle">queue.close() → graceful shutdown</text>
<line x1="373" y1="808" x2="522" y2="808" fill="none" stroke="#378ADD" marker-end="url(#arrow)"/>
<text class="ts" x="445" y="802" text-anchor="middle">close Live API session</text>
<line x1="373" y1="826" x2="218" y2="826" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="820" text-anchor="middle">persist session → SessionService</text>
<rect x="36" y="848" width="630" height="32" rx="6" fill="#E6F1FB" opacity=".8"/>
<text class="ts" x="340" y="860" text-anchor="middle" fill="#0C447C">↩ session_resumption: on reconnect, ADK restores conversation history</text>
<text class="ts" x="340" y="876" text-anchor="middle" fill="#0C447C">Live API session is ephemeral · ADK Session is persistent (DB / Vertex AI)</text>

<!-- Legend -->
<rect x="28" y="898" width="638" height="112" rx="8" fill="none" stroke="#ddd" stroke-width="0.5"/>
<text class="th" x="42" y="920">Legend</text>
<line x1="42" y1="936" x2="90" y2="936" stroke="#1D9E75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="96" y="940">Client → Server</text>
<line x1="198" y1="936" x2="246" y2="936" stroke="#7F77DD" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="252" y="940">Server → ADK</text>
<line x1="338" y1="936" x2="386" y2="936" stroke="#378ADD" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="392" y="940">ADK → Gemini Live</text>
<line x1="502" y1="936" x2="550" y2="936" stroke="#D85A30" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="556" y="940">Tool call</text>
<line x1="42" y1="968" x2="90" y2="968" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="96" y="972">Return / event</text>
<line x1="198" y1="968" x2="246" y2="968" stroke="#E24B4A" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="252" y="972">Disconnect / error</text>
<text class="ts" x="380" y="972" fill="#888">VAD = Voice Activity Detection · BIDI = bidirectional WebSocket</text>
</svg>