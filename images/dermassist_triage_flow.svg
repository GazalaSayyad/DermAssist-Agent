<?xml version="1.0" encoding="UTF-8"?>
<svg id="flow-svg" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
<defs><style>
.th{font:500 14px Arial;fill:#1a1a1a}.ts{font:400 12px Arial;fill:#555}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th,.c-teal .ts{fill:#085041}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th,.c-purple .ts{fill:#3C3489}
.c-amber rect,.c-amber polygon{fill:#FAEEDA;stroke:#BA7517}.c-amber .th,.c-amber .ts{fill:#633806}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th,.c-coral .ts{fill:#4A1B0C}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th,.c-red .ts{fill:#501313}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th,.c-blue .ts{fill:#0C447C}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th,.c-gray .ts{fill:#2C2C2A}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker></defs>

<g class="c-teal"><rect x="230" y="18" width="220" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="40" text-anchor="middle">Patient connects via WS</text>
<text class="ts" x="340" y="58" text-anchor="middle">text · voice · camera</text></g>
<line x1="340" y1="70" x2="340" y2="104" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="190" y="108" width="300" height="72" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle">Step 1 — Structured intake</text>
<text class="ts" x="340" y="150" text-anchor="middle">1–2 questions at a time via Gemini Live</text>
<text class="ts" x="340" y="166" text-anchor="middle">complaint · onset · location · meds · flags</text></g>
<line x1="340" y1="180" x2="340" y2="214" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision diamond: Image? -->
<polygon points="340,218 440,258 340,298 240,258" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text class="th" x="340" y="252" text-anchor="middle" fill="#633806">Image / video shared?</text>
<text class="ts" x="340" y="270" text-anchor="middle" fill="#633806">JPEG frame via send_realtime()</text>
<line x1="440" y1="258" x2="540" y2="258" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="250" text-anchor="middle" fill="#BA7517">YES</text>
<g class="c-amber"><rect x="544" y="226" width="120" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="604" y="248" text-anchor="middle">Step 2</text>
<text class="ts" x="604" y="264" text-anchor="middle">Image analysis</text>
<text class="ts" x="604" y="280" text-anchor="middle">morphology · borders</text></g>
<path d="M604 290 L604 310 L340 310 L340 298" fill="none" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="298" x2="340" y2="332" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="320" fill="#BA7517">NO / continue</text>

<g class="c-gray"><rect x="190" y="336" width="300" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="358" text-anchor="middle">Step 3 — Triage red-flag check</text>
<text class="ts" x="340" y="376" text-anchor="middle">ADK agent evaluates symptoms + flags</text></g>
<line x1="340" y1="388" x2="340" y2="422" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision diamond: Priority? -->
<polygon points="340,426 450,472 340,518 230,472" fill="#F1EFE8" stroke="#888" stroke-width="1.2"/>
<text class="th" x="340" y="462" text-anchor="middle" fill="#2C2C2A">Triage priority?</text>
<text class="ts" x="340" y="480" text-anchor="middle" fill="#555">fever+spread · mucosal</text>
<text class="ts" x="340" y="496" text-anchor="middle" fill="#555">immunocomp · pregnancy</text>

<line x1="230" y1="472" x2="96" y2="472" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="162" y="462" text-anchor="middle" fill="#E24B4A">EMERGENCY</text>
<g class="c-red"><rect x="18" y="494" width="150" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="93" y="518" text-anchor="middle">🚨 ER Now</text>
<text class="ts" x="93" y="538" text-anchor="middle">Immediate referral</text>
<text class="ts" x="93" y="556" text-anchor="middle">Brief differential</text>
<text class="ts" x="93" y="574" text-anchor="middle">for clinician</text>
<text class="ts" x="93" y="592" text-anchor="middle">STOP — no search</text></g>

<line x1="450" y1="472" x2="574" y2="472" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="462" text-anchor="middle" fill="#1D9E75">ROUTINE</text>
<g class="c-teal"><rect x="512" y="494" width="150" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="587" y="518" text-anchor="middle">Standard appt</text>
<text class="ts" x="587" y="538" text-anchor="middle">No red flags</text>
<text class="ts" x="587" y="556" text-anchor="middle">Chronic / stable</text>
<text class="ts" x="587" y="574" text-anchor="middle">→ proceed to</text>
<text class="ts" x="587" y="592" text-anchor="middle">search + summary</text></g>

<line x1="340" y1="518" x2="340" y2="552" fill="none" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="356" y="540" fill="#BA7517">URGENT</text>
<g class="c-amber"><rect x="224" y="556" width="232" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="578" text-anchor="middle">Same-day / urgent care</text>
<text class="ts" x="340" y="597" text-anchor="middle">single red flag · advise promptly</text></g>
<line x1="340" y1="620" x2="340" y2="654" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M512 598 L512 638 L340 638 L340 654" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="172" y="658" width="336" height="64" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="680" text-anchor="middle">Step 4 — Evidence-based search</text>
<text class="ts" x="340" y="698" text-anchor="middle">google_search: "first-line mgmt [condition] 2026"</text>
<text class="ts" x="340" y="714" text-anchor="middle">ADK auto-executes · AAD · UpToDate · BMJ</text></g>
<line x1="340" y1="722" x2="340" y2="756" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="100" y="760" width="480" height="134" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="784" text-anchor="middle">Step 5 — Consultation summary</text></g>
<g class="c-gray"><rect x="116" y="798" width="208" height="84" rx="6" stroke-width="0.5"/>
<text class="ts" x="220" y="816" text-anchor="middle">Suspected condition(s)</text>
<text class="ts" x="220" y="832" text-anchor="middle">Confidence: High/Med/Low</text>
<text class="ts" x="220" y="848" text-anchor="middle">Triage priority reason</text>
<text class="ts" x="220" y="864" text-anchor="middle">Tx overview (Rx/OTC)</text></g>
<g class="c-gray"><rect x="356" y="798" width="208" height="84" rx="6" stroke-width="0.5"/>
<text class="ts" x="460" y="816" text-anchor="middle">Questions for physician</text>
<text class="ts" x="460" y="832" text-anchor="middle">Recommended next steps</text>
<text class="ts" x="460" y="848" text-anchor="middle">Evidence citations</text>
<text class="ts" x="460" y="864" text-anchor="middle">Mandatory disclaimer</text></g>
<line x1="340" y1="894" x2="340" y2="928" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="932" width="300" height="40" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="956" text-anchor="middle">Delivered via WS · audio + text</text></g>
</svg>